[package]
name = "emersia-daemon"
description = "Emersia host daemon: Wayland capture, hardware encode, RTP/UDP streaming, uinput control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "emersia-daemon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
libc = "0.2.189"
png = "0.18.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rustix = { version = "1.1.5", features = ["event"] }
tempfile = "3.27.0"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

emersia-protocol = { path = "../emersia-protocol" }
# `static_secrets` is required for long-term device identity keys (ADR 0006).
x25519-dalek = { version = "3", features = ["static_secrets"] }
chacha20poly1305 = "0.11"
hkdf = "0.13"
sha2 = "0.11"
getrandom = "0.4"
hex = "0.4"
aead = "0.6"
