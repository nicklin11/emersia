name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    name: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository hygiene (pre-check)
        run: bash scripts/pre-check.sh

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      # The encoder is the ffmpeg CLI (ADR 0003), and the encoder tests are
      # only meaningful when it is actually present: without it they skip and
      # the most important part of M1.5 goes untested. Software x264 comes from
      # the ffmpeg binary, so no GPU is needed for these.
      - name: Install ffmpeg (encoder under test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: rustfmt
        if: hashFiles('host/Cargo.toml') != ''
        run: cargo fmt --manifest-path host/Cargo.toml --all -- --check
      - name: clippy
        if: hashFiles('host/Cargo.toml') != ''
        run: cargo clippy --manifest-path host/Cargo.toml --all-targets -- -D warnings
      - name: test
        if: hashFiles('host/Cargo.toml') != ''
        run: cargo test --manifest-path host/Cargo.toml
      # The wire protocol is compiled into the Quest client (ADR 0007), so it
      # must keep building for Android. `check` needs no NDK linker.
      - name: emersia-transport builds for Android
        if: hashFiles('host/Cargo.toml') != ''
        run: cargo check --manifest-path host/Cargo.toml -p emersia-transport --target aarch64-linux-android

  # Quest client core (ADR 0007): host tests of the session logic, then lint
  # the Android-only modules (MediaCodec, JNI) against the real target.
  client:
    name: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/android/native
      - name: rustfmt
        run: cargo fmt --manifest-path client/android/native/Cargo.toml -- --check
      - name: clippy (host)
        run: cargo clippy --manifest-path client/android/native/Cargo.toml --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path client/android/native/Cargo.toml
      - name: clippy (aarch64-linux-android)
        run: cargo clippy --manifest-path client/android/native/Cargo.toml --target aarch64-linux-android -- -D warnings

  # End-to-end against a real compositor: headless sway (no display, no GPU),
  # a runtime-created virtual output, capture -> software encode -> encrypted
  # UDP -> decode-verified receive. scripts/qa-sway-headless.sh.
  sway:
    name: sway-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: Install sway and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sway ffmpeg
          sway --version
      - name: Build
        run: cargo build --release --manifest-path host/Cargo.toml
      - name: Headless sway end-to-end
        run: scripts/qa-sway-headless.sh --encoder sw

  # Aggregate check — this is the single required status on `main`.
  ci:
    name: ci
    needs: [validation, rust, client, sway]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs green?
        run: |
          if [ "${{ needs.validation.result }}" != "success" ] || [ "${{ needs.rust.result }}" != "success" ] || [ "${{ needs.client.result }}" != "success" ] || [ "${{ needs.sway.result }}" != "success" ]; then
            echo "required jobs did not succeed"
            exit 1
          fi
          echo "ci OK"
